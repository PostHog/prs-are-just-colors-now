<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRs are just colors now</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23114436'/%3E%3C/svg%3E">
<style>
:root{--background:#0b1013;--foreground:#dbe2db;--muted:#a4afa8;--dim:#69756e;--border:#53615a;--map-border:#dbe2db38;--map-outline:#dbe2db9c;--highlight:#fff;color-scheme:dark}
:root[data-theme=light]{--background:#fff;--foreground:#101010;--muted:#555;--dim:#777;--border:#bbb;--map-border:#00000030;--map-outline:#0000009c;--highlight:#eaff00;color-scheme:light}
.theme-toggle{position:absolute;right:4vw;bottom:22px;border:0;background:var(--background);color:var(--dim);padding:10px 0;font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;cursor:pointer}
.theme-toggle:focus-visible{outline:1px solid var(--foreground);outline-offset:4px}
@media(max-width:600px){.theme-toggle{right:24px;bottom:10px}}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}[hidden]{display:none!important}a{color:inherit;text-underline-offset:4px}a:focus-visible{outline:1px solid var(--foreground);outline-offset:4px}.journey{height:700svh;position:relative}.stage{height:96svh;position:sticky;top:0;overflow:hidden;isolation:isolate}canvas{display:block;position:absolute;inset:0;width:100%;height:100%}.note{position:absolute;left:50%;bottom:35px;transform:translateX(-50%);width:max-content;max-width:85%;text-align:center;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--foreground);pointer-events:none;text-wrap:balance}.note a{pointer-events:auto}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.authors{position:absolute;left:4vw;top:30px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);max-width:92%}.authors select,.authors input{font:inherit;color:var(--foreground);background:var(--background);border:0;border-bottom:1px solid var(--border);border-radius:0;padding:5px 2px;max-width:100%;color-scheme:inherit}.authors select{width:155px}.authors input{width:175px}.authors select:focus-visible,.authors input:focus-visible{outline:1px solid var(--foreground);outline-offset:4px}.authors output{font-size:11px;color:var(--muted)}
.projection{position:absolute;right:4vw;top:calc(18% + 166px);display:flex;gap:6px}.projection button{min-width:44px;min-height:44px;padding:3px 0;border:0;background:none;color:var(--dim);font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;cursor:pointer}.projection button[aria-pressed=true]{color:var(--foreground)}.projection button:focus-visible{outline:1px solid var(--foreground);outline-offset:4px}.color-space{position:absolute;right:4vw;top:18%;width:156px;aspect-ratio:1;padding:0;background:transparent;border:1px solid var(--map-border);cursor:pointer;overflow:hidden}.color-space #hex-plane{opacity:0;transition:opacity .2s ease}.color-space:focus-visible{outline:1px solid var(--foreground);outline-offset:5px}.color-space:focus-visible #hex-plane,.color-space[aria-pressed=true] #hex-plane{opacity:1}@media(hover:hover){.color-space:hover #hex-plane{opacity:1}}
@media(max-width:600px){.journey{height:650svh}.authors{left:24px;top:24px;max-width:calc(100% - 48px);gap:8px}.authors select{width:135px}.authors input{width:150px}.authors output{flex-basis:100%}.note{bottom:56px;max-width:calc(100% - 48px);font-size:11px;overflow-wrap:anywhere}.color-space{right:24px;top:26%;width:94px}.projection{right:24px;top:calc(26% + 104px)}}
@media(prefers-reduced-motion:reduce){.journey{height:200svh}.color-space #hex-plane{transition:none}}
</style>
</head>
<body>
<main><section class="journey" id="spill" aria-label="Spill, a scroll-driven color study"><div class="stage">
<canvas aria-label="A hanging ribbon of real PostHog PR colors feeds directly into a two-dimensional color plane as you scroll. Its short tip follows each next cell, laying down one flat colored pixel at a time."></canvas>
<form class="authors" onsubmit="return false"><label for="author">Show PRs by</label><select id="author"><option value="" selected>—</option><option value="trunk-io[bot]">trunk-io</option><option value="posthog[bot]">posthog</option><option value="custom">GitHub username…</option></select><label class="sr-only" for="username">GitHub username</label><input id="username" placeholder="GitHub username" autocomplete="off" autocapitalize="none" spellcheck="false" hidden><output id="matches" aria-live="polite"></output></form>
<button class="color-space" type="button" aria-label="Reveal the color map" aria-pressed="false"><canvas id="hex-plane" aria-hidden="true"></canvas><canvas id="hex-prs" aria-hidden="true"></canvas></button>
<div class="projection" role="group" aria-label="Color projection"><button type="button" data-projection="hue" aria-pressed="true">Hue</button><button type="button" data-projection="hex" aria-pressed="false">Hex</button></div>
<button class="theme-toggle" type="button" aria-pressed="false">Light mode</button>
<div class="note" aria-live="polite" hidden></div>
</div></section></main>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
'use strict';
const themeToggle=document.querySelector('.theme-toggle');let outline='#fff',background='#0b1013',mapOutline='#dbe2db9c';
themeToggle.addEventListener('click',()=>{const light=themeToggle.getAttribute('aria-pressed')!=='true';document.documentElement.dataset.theme=light?'light':'dark';themeToggle.setAttribute('aria-pressed',String(light));themeToggle.textContent=light?'Dark mode':'Light mode';outline=light?'#eaff00':'#fff';background=light?'#fff':'#0b1013';mapOutline=light?'#0000009c':'#dbe2db9c';requestDraw();});
const snapshot=JSON.parse(document.getElementById('snapshot').textContent);
const planePosition=hex=>{const value=parseInt(hex,16);let x=0,y=0;for(let bit=0;bit<12;bit++){x|=((value>>>(2*bit))&1)<<bit;y|=((value>>>(2*bit+1))&1)<<bit;}return {x,y};};
const hueLightness=hex=>{const value=parseInt(hex,16),r=(value>>>16)/255,g=((value>>>8)&255)/255,b=(value&255)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),delta=max-min,lightness=(max+min)/2;let hue=0;if(delta){if(max===r)hue=((g-b)/delta+6)%6;else if(max===g)hue=(b-r)/delta+2;else hue=(r-g)/delta+4;hue*=60;}return {hue,lightness};};
const huePlaneSize=Math.max(512,2**Math.ceil(Math.log2(Math.sqrt(snapshot.prs.length*4))));
function packHuePositions(numbers){const occupied=new Set(),offsets=[];for(let dx=-32;dx<=32;dx++)for(let dy=-32;dy<=32;dy++)offsets.push({dx,dy,distance:dx*dx+dy*dy});offsets.sort((a,b)=>a.distance-b.distance||a.dy-b.dy||a.dx-b.dx);
return numbers.map(number=>{const {hue,lightness}=hueLightness(String(number)),x=Math.round(hue/360*(huePlaneSize-1)),y=Math.round(lightness*(huePlaneSize-1));
function take(dx,dy){const px=x+dx,py=y+dy;if(px<0||px>=huePlaneSize||py<0||py>=huePlaneSize)return null;const key=py*huePlaneSize+px;if(occupied.has(key))return null;occupied.add(key);return {x:px,y:py};}
for(const {dx,dy} of offsets){const point=take(dx,dy);if(point)return point;}
for(let radius=33;radius<huePlaneSize;radius++){for(let d=-radius;d<=radius;d++)for(const [dx,dy] of [[d,-radius],[d,radius],[-radius,d],[radius,d]]){const point=take(dx,dy);if(point)return point;}}
throw Error('No room in the hue plane');});}
const hslRGB=(hue,lightness)=>{const a=Math.min(lightness,1-lightness),channel=n=>{const k=(n+hue/30)%12;return Math.round(255*(lightness-a*Math.max(-1,Math.min(k-3,9-k,1))));};return [channel(0),channel(8),channel(4)];};

const prs=[...snapshot.prs].sort((a,b)=>a.number-b.number).map((pr,index)=>({...pr,index,accountType:pr.bot?'Bot':'User',url:'https://github.com/PostHog/posthog/pull/'+pr.number,hex:'#'+pr.number,...planePosition(String(pr.number))}));
const huePositions=packHuePositions(prs.map(pr=>pr.number));prs.forEach((pr,i)=>{pr.layouts={hex:{x:pr.x,y:pr.y},hue:huePositions[i]};});
let minX,maxX,minY,maxY,center,projection='hue',planeSize=huePlaneSize;const positions=new Map();
const canvas=document.querySelector('canvas'),context=canvas.getContext('2d'),journey=document.querySelector('.journey'),stage=document.querySelector('.stage'),note=document.querySelector('.note');
const raster=document.createElement('canvas');const ink=raster.getContext('2d');
const author=document.getElementById('author'),username=document.getElementById('username'),matches=document.getElementById('matches');
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),automaticDetails=matchMedia('(max-width: 600px), (hover: none)'),clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,t)=>a+(b-a)*t,smooth=x=>{x=clamp(x);return x*x*(3-2*x);};
let detailNumber=null;
function showDetails(pr){note.hidden=!pr;if(!pr){detailNumber=null;return;}if(detailNumber===pr.number)return;detailNumber=pr.number;const link=document.createElement('a');link.textContent=pr.hex+' / '+pr.author+' / '+(pr.accountType==='Bot'?'bot':'human')+' / '+pr.state;link.href=pr.url;link.title=pr.title;link.target='_blank';link.rel='noopener noreferrer';note.replaceChildren(link);}
let width=0,height=0,pending=false,progress=0,hitPoints=[],hovered=null,painted=0,laid=0,selected='',selectedPRs=[],lastCamera=null;
function selectAuthor(){username.hidden=author.value!=='custom';selected=(author.value==='custom'?username.value.trim().replace(/^@/,''):author.value).toLowerCase();selectedPRs=selected?prs.filter(pr=>pr.author.toLowerCase()===selected):[];matches.textContent=selected&&!selectedPRs.length?'No matching PRs':'';hovered=null;showDetails(null);requestDraw();}
author.addEventListener('change',()=>{selectAuthor();if(author.value==='custom')username.focus();});username.addEventListener('input',selectAuthor);
function setProjection(value){projection=value;planeSize=value==='hue'?huePlaneSize:4096;minX=minY=planeSize;maxX=maxY=0;positions.clear();for(const pr of prs){const point=pr.layouts[value];pr.x=point.x;pr.y=point.y;minX=Math.min(minX,pr.x);maxX=Math.max(maxX,pr.x);minY=Math.min(minY,pr.y);maxY=Math.max(maxY,pr.y);positions.set(pr.x+','+pr.y,pr);}center={x:(minX+maxX+1)/2,y:(minY+maxY+1)/2};raster.width=maxX-minX+1;raster.height=maxY-minY+1;painted=0;hovered=null;showDetails(null);hasSpectrum=false;if(hexPlane.width>300)revealSpectrum();document.querySelectorAll('[data-projection]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.projection===value)));requestDraw();}
document.querySelectorAll('[data-projection]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.projection!==projection)setProjection(button.dataset.projection);}));
function camera(){const mobile=width<600,scale=Math.min(width*(mobile?.86:.76)/(raster.width+4),height*(mobile?.32:.36)/(raster.height+4));return {scale,x:center.x,y:center.y,screenX:width*.52,screenY:height*(mobile?.75:.74)};}
function project(pr,cam){return {x:cam.screenX+(pr.x+.5-cam.x)*cam.scale,y:cam.screenY+(cam.y-pr.y-.5)*cam.scale};}
function polygon(points,color,highlight=false){context.fillStyle=color;context.beginPath();points.forEach((p,i)=>i?context.lineTo(p.x,p.y):context.moveTo(p.x,p.y));context.closePath();context.fill();if(highlight){context.strokeStyle=outline;context.lineWidth=.8;context.stroke();}}
function updateInk(count){if(count<painted){ink.clearRect(0,0,raster.width,raster.height);painted=0;}for(let i=painted;i<count;i++){const pr=prs[i];ink.fillStyle=pr.hex;ink.fillRect(pr.x-minX,maxY-pr.y,1,1);}painted=count;}
const colorSpace=document.querySelector('.color-space'),hexPlane=document.getElementById('hex-plane'),hexPRs=document.getElementById('hex-prs'),mapContext=hexPRs.getContext('2d');
const planeColor=(x,y)=>{let value=0;for(let bit=0;bit<12;bit++){value|=((x>>>bit)&1)<<(2*bit);value|=((y>>>bit)&1)<<(2*bit+1);}return value;};
let hasSpectrum=false,mapSize=0;
function revealSpectrum(){if(hasSpectrum)return;const size=1024;hexPlane.width=hexPlane.height=size;const spectrum=hexPlane.getContext('2d'),image=spectrum.createImageData(size,size),data=image.data;
// Hex samples average 4 × 4 exact cells; Hue shows the saturated hue/lightness slice.
for(let y=0;y<size;y++)for(let x=0;x<size;x++){const offset=(y*size+x)*4;let r,g,b;if(projection==='hue')[r,g,b]=hslRGB(x/(size-1)*360,1-y/(size-1));else{const color=planeColor(x*4,(size-1-y)*4);r=color>>>16;g=(color>>>8)&255;b=(color&255)+8;}data[offset]=r;data[offset+1]=g;data[offset+2]=b;data[offset+3]=255;}spectrum.putImageData(image,0,0);hasSpectrum=true;}
colorSpace.addEventListener('pointerenter',revealSpectrum);colorSpace.addEventListener('focus',revealSpectrum);colorSpace.addEventListener('click',()=>{revealSpectrum();colorSpace.setAttribute('aria-pressed',String(colorSpace.getAttribute('aria-pressed')!=='true'));});
function overview(){const scale=mapSize/planeSize;mapContext.clearRect(0,0,mapSize,mapSize);mapContext.imageSmoothingEnabled=false;mapContext.drawImage(raster,minX*scale,(planeSize-1-maxY)*scale,raster.width*scale,raster.height*scale);const x=minX*scale-2,y=(planeSize-1-maxY)*scale-2,w=raster.width*scale+4,h=raster.height*scale+4;mapContext.lineWidth=2;mapContext.strokeStyle=background;mapContext.strokeRect(x,y,w,h);mapContext.lineWidth=.8;mapContext.strokeStyle=mapOutline;mapContext.strokeRect(x,y,w,h);}
function paint(p){progress=p;journey.dataset.progress=p.toFixed(3);context.clearRect(0,0,width,height);const cam=camera();lastCamera=cam;
const count=clamp((p-.07)/.84)*prs.length,index=Math.min(prs.length-1,Math.floor(count)),amount=smooth(count-Math.floor(count)),finished=count>=prs.length;laid=Math.floor(count);updateInk(laid);if(automaticDetails.matches)showDetails(finished?null:prs[index]);
const cellSize=cam.scale,drop=Math.max(19,cam.scale*2.4),current=project(prs[index],cam),previous=project(prs[Math.max(0,index-1)],cam),head={x:mix(previous.x,current.x,amount),y:mix(previous.y,current.y,amount)-drop};
const segmentLength=2;
function ribbon(distance){const length=Math.max(0,distance)*segmentLength,s=clamp(length/(height*.83)),wave=smooth(length/(height*.16));return {x:mix(head.x,width*.57,smooth(s))+wave*(Math.sin(s*Math.PI*2)*width*.10+Math.sin(s*Math.PI*4)*width*.025),y:head.y-length,width:mix(cellSize*.72,width<600?38:66,smooth(length/(height*.48)))};}
function normal(distance){const a=ribbon(Math.max(0,distance-.05)),b=ribbon(distance+.05),dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;return {x:-dy/len,y:dx/len};}
hitPoints=[];
if(!finished){const visibleEnd=Math.min(prs.length,index+Math.ceil((head.y+100)/segmentLength)+2);for(let i=index;i<visibleEnd;i++){const distance=Math.max(0,i-count),a=ribbon(distance),b=ribbon(Math.max(0,i+1-count)),na=normal(distance),nb=normal(Math.max(0,i+1-count));polygon([{x:a.x+na.x*a.width/2,y:a.y+na.y*a.width/2},{x:b.x+nb.x*b.width/2,y:b.y+nb.y*b.width/2},{x:b.x-nb.x*b.width/2,y:b.y-nb.y*b.width/2},{x:a.x-na.x*a.width/2,y:a.y-na.y*a.width/2}],prs[i].hex,selected&&prs[i].author.toLowerCase()===selected);hitPoints.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,pr:prs[i],radius:Math.max(3,a.width*.52),line:[{x:(a.x+na.x*a.width/2+b.x+nb.x*b.width/2)/2,y:(a.y+na.y*a.width/2+b.y+nb.y*b.width/2)/2},{x:(a.x-na.x*a.width/2+b.x-nb.x*b.width/2)/2,y:(a.y-na.y*a.width/2+b.y-nb.y*b.width/2)/2}]});}}
context.imageSmoothingEnabled=false;const corner=project({x:minX,y:maxY},cam);context.drawImage(raster,corner.x-cellSize/2,corner.y-cellSize/2,raster.width*cam.scale,raster.height*cam.scale);
context.strokeStyle=outline;context.lineWidth=Math.min(.85,cellSize*.35);context.beginPath();for(const pr of selectedPRs){if(pr.index>=laid)continue;const point=project(pr,cam);context.rect(point.x-cellSize/2,point.y-cellSize/2,cellSize,cellSize);}context.stroke();
if(!finished&&count>0){const falling={x:head.x,y:head.y+drop*amount},neck=cellSize*.72;context.fillStyle=prs[index].hex;context.fillRect(head.x-neck/2,head.y,neck,drop*amount);context.fillRect(falling.x-cellSize/2,falling.y-cellSize/2,cellSize,cellSize);if(selected&&prs[index].author.toLowerCase()===selected){context.strokeStyle=outline;context.lineWidth=.75;context.strokeRect(falling.x-cellSize/2,falling.y-cellSize/2,cellSize,cellSize);}hitPoints.push({...falling,pr:prs[index],radius:Math.max(5,cellSize)});}
overview();
if(!automaticDetails.matches&&hovered){let point=hitPoints.find(point=>point.pr.number===hovered.number);if(!point&&hovered.index<laid)point=project(hovered,cam);if(point){context.strokeStyle=outline;if(point.line){context.lineWidth=1.2;context.beginPath();context.moveTo(point.line[0].x,point.line[0].y);context.lineTo(point.line[1].x,point.line[1].y);context.stroke();}else{context.lineWidth=.8;const size=Math.max(8,cellSize+3);context.strokeRect(point.x-size/2,point.y-size/2,size,size);}}}
}
function draw(){pending=false;const rect=journey.getBoundingClientRect();if(rect.bottom<0||rect.top>innerHeight)return;let p=clamp(-rect.top/(journey.offsetHeight-stage.offsetHeight));if(reduced.matches)p=p<.25?0:p<.65?.68:1;paint(p);}
function requestDraw(){if(!pending){pending=true;requestAnimationFrame(draw);}}
function resize(){const rect=stage.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2);width=rect.width;height=rect.height;canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);context.setTransform(ratio,0,0,ratio,0,0);mapSize=colorSpace.clientWidth;hexPRs.width=hexPRs.height=Math.round(mapSize*ratio);mapContext.setTransform(ratio,0,0,ratio,0,0);requestDraw();}
canvas.addEventListener('pointermove',event=>{if(event.pointerType==='touch'||automaticDetails.matches)return;const rect=canvas.getBoundingClientRect(),x=event.clientX-rect.left,y=event.clientY-rect.top;let nearest=null,distance=Infinity;const cam=lastCamera;if(cam){const wx=Math.floor(cam.x+(x-cam.screenX)/cam.scale),wy=Math.floor(cam.y-(y-cam.screenY)/cam.scale),pr=positions.get(wx+','+wy);if(pr&&pr.index<laid)nearest=pr;}if(!nearest)for(const point of hitPoints){const d=Math.hypot(x-point.x,y-point.y);if(d<point.radius&&d<distance){nearest=point.pr;distance=d;}}if(nearest?.number===hovered?.number)return;hovered=nearest;showDetails(nearest);requestDraw();});
stage.addEventListener('pointerleave',()=>{hovered=null;if(!automaticDetails.matches)showDetails(null);requestDraw();});addEventListener('scroll',requestDraw,{passive:true});addEventListener('resize',resize);reduced.addEventListener('change',requestDraw);function detailModeChanged(){hovered=null;showDetails(null);note.setAttribute('aria-live',automaticDetails.matches?'off':'polite');requestDraw();}automaticDetails.addEventListener('change',detailModeChanged);detailModeChanged();setProjection('hue');resize();
</script>
</body>
